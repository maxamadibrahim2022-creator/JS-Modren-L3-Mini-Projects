<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Processing App</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="style.css">

    <!-- Load JavaScript after the HTML is parsed -->
    <script src="main.js" defer></script>
</head>
<body>
    <main class="app">
        <h1>Task Processing App</h1>

        <p class="description">
            Learn how asynchronous callbacks process tasks in order.
        </p>

        <div class="status-card">
            <span class="label">Current status</span>
            <p id="status">Ready to start</p>
        </div>

        <div class="actions">
            <button id="startBtn" type="button">
                Start Processing
            </button>

            <button id="resetBtn" type="button" class="reset-btn">
                Reset
            </button>
        </div>

        <section class="tasks">
            <h2>Processing Steps</h2>

            <ul>
                <li id="downloadTask">1. Download file</li>
                <li id="processTask">2. Process file</li>
                <li id="saveTask">3. Save file</li>
            </ul>
        </section>

        <section class="log-section">
            <h2>Activity Log</h2>

            <ol id="logList">
                <li>Waiting for you to start...</li>
            </ol>
        </section>
    </main>
</body>
</html>
