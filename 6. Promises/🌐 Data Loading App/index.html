<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Data Loading App</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Connect JavaScript -->
    <script src="main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>🌐 Data Loading App</h1>
      <p class="description">
        Practice JavaScript Promises by loading user data.
      </p>

      <!-- Action buttons -->
      <div class="buttons">
        <button id="loadBtn">Load User</button>

        <button id="errorBtn" class="error-button">Simulate Error</button>
      </div>

      <!-- Load indicator -->
      <p id="loading" class="loading hidden">⏳ Loading user data...</p>

      <!-- Status Massage -->
       <p id="status">Ready to load data.</p>

       <!-- User Information -->
        <section id="userCard" class="user-card hidden">
            
            <h2>User Information</h2>

            <p>
                <strong>Name:</strong>
                <span id="userName"></span>
            </p>

            <p>
                <strong>Email</strong>
                <span id="userEmail"></span>
            </p>

            <p>
                <strong>Role:</strong>
                <span id="userRole"></span>
            </p>
            
        </section>
    </main>
    
  </body>
</html>
